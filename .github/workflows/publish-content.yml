name: Publish content branches

# Fully automatic publishing. The scheduled writer pushes a content/<slug>
# branch; this merges it into main, which deploys and fires IndexNow.
#
# There is no human review step any more — that was a deliberate choice, and
# scripts/guard-post.mjs is what stands in its place. The guard cannot tell
# whether a post is good. It catches the failure that actually costs money: a
# confident invented number going out under Muhammad's name.
#
# A post that fails the guard is NOT published and NOT discarded. The branch
# stays exactly where it is and an issue opens saying why.

on:
  push:
    branches:
      - 'content/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find the post this branch adds
        id: post
        run: |
          set -euo pipefail
          # --depth=0 is a clone option, not a fetch option; git exits 128 on it.
          # The checkout already has full history, this just guarantees the ref.
          git fetch --no-tags origin main:refs/remotes/origin/main
          BASE=$(git merge-base refs/remotes/origin/main HEAD)
          FILES=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'app/*/page.js' || true)
          if [ -z "$FILES" ]; then
            echo "No new post file on this branch." >&2
            exit 1
          fi
          echo "files<<EOFX" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOFX" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$FILES" | head -1 | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - name: Parse-check the generated files
        run: |
          set -euo pipefail
          npm i --no-save sucrase@3 >/dev/null 2>&1
          node -e '
            const fs=require("fs"),{transform}=require("sucrase");
            for (const f of process.argv.slice(1)) {
              transform(fs.readFileSync(f,"utf8"),{transforms:["jsx","imports"],jsxRuntime:"automatic",filePath:f});
              console.log("OK "+f);
            }
          ' ${{ steps.post.outputs.files }} data/blog.js

      - name: Guard
        id: guard
        # pipefail is NOT set by default in an Actions `run` step, so without
        # it `| tee` returns tee's exit code and a held post would sail
        # straight through the merge. The guard has to be able to say no.
        run: |
          set -o pipefail
          node scripts/guard-post.mjs ${{ steps.post.outputs.files }} 2>&1 | tee guard.log

      - name: Merge into main
        run: |
          set -euo pipefail
          git config user.name  "Muhammad Kashif"
          git config user.email "info@muhammadkashif.net"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          git merge --no-ff "$GITHUB_SHA" -m "content: publish ${{ steps.post.outputs.slug }}

          Merged automatically after scripts/guard-post.mjs passed.
          No human reviewed this post before it went live."
          git push origin main
          git push origin --delete "${GITHUB_REF#refs/heads/}" || true

      - name: Hold and report
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let log = 'The guard step produced no output.'
            try { log = fs.readFileSync('guard.log', 'utf8') } catch {}
            const branch = context.ref.replace('refs/heads/', '')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Held: ${branch}`,
              body: [
                `\`${branch}\` was not published. The branch is untouched — nothing was lost.`,
                '',
                'What the guard said:',
                '',
                '```',
                log.slice(0, 5000),
                '```',
                '',
                `Fix it on the branch and push again, or merge it by hand if the guard is wrong.`,
                `Run: \`git checkout ${branch}\``,
              ].join('\n'),
            })
